schema {
  query: Query
}

"A connection to a list of items."
type AllFurnitureConnection {
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "A list of edges."
  edges: [AllFurnitureEdge!]
  "A flattened list of the nodes."
  nodes: [Furniture!]
}

"An edge in a connection."
type AllFurnitureEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: Furniture!
}

type Category {
  _Id: String!
  id: String
  name: String
