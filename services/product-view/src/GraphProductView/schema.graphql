}

type Furniture {
  id: String
  salesPostGuid: String
  guid: String
  personId: String
  title: String
  description: String
  size: String
  quantity: String
  price: Int!
  condition: String
  zip_code: String
  status: Status
  color: Color
  categories: [Category!]
  images: [Image!]
}

type Image {
  _Id: String!
  id: String
  url: String
}

"Information about pagination in a connection."
type PageInfo {
  "Indicates whether more edges exist following the set defined by the clients arguments."
  hasNextPage: Boolean!
  "Indicates whether more edges exist prior the set defined by the clients arguments."
  hasPreviousPage: Boolean!
  "When paginating backwards, the cursor to continue."
  startCursor: String
  "When paginating forwards, the cursor to continue."
  endCursor: String
}

type Query {
  allFurniture("Returns the first _n_ elements from the list." first: Int "Returns the elements in the list that come after the specified cursor." after: String "Returns the last _n_ elements from the list." last: Int "Returns the elements in the list that come before the specified cursor." before: String where: FurnitureFilterInput @cost(weight: "10") order: [FurnitureSortInput!] @cost(weight: "10")): AllFurnitureConnection @listSize(assumedSize: 50, slicingArguments: [ "first", "last" ], slicingArgumentDefaultValue: 10, sizedFields: [ "edges", "nodes" ], requireOneSlicingArgument: false) @cost(weight: "10")
  furnitureById(id: String!): Furniture! @cost(weight: "10")
}

