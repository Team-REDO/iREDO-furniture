services:
  api-gateway:
    container_name: iredo-api-gateway
    build:
      context: ./services/api-gateway
    env_file:
      - ./services/api-gateway/.env
    ports:
      - "${API_GATEWAY_PORT}:3100"
    depends_on:
      product-view:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongodb:
    container_name: iredo-mongodb
    image: mongo:7.0
    environment:
      MONGO_INITDB_DATABASE: furnituredatabase
    volumes:
      - mongodb-data:/data/db
      - ./infrastructure/databases/init-mongo.js:/docker-entrypoint-initdb.d/01-init.js:ro
    restart: unless-stopped

  product-view:
    container_name: iredo-product-view
    build:
      context: ./services/product-view/src/GraphProductView
    env_file:
      - ./services/product-view/.env
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "${PRODUCT_VIEW_PORT}:8080"
    depends_on:
      mongodb:
        condition: service_started
    restart: unless-stopped

  client:
    container_name: iredo-client
    build:
      context: ./client
    ports:
      - "${CLIENT_PORT}:5173"
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodb-data:
